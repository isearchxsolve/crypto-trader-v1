services:
  trading-engine:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MODE: paper
      NODE_ENV: production
      SKIP_VITE: "true"
      PORT: "5000"
    ports:
      - "5000:5000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||5000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - engine-logs:/app/logs
      - engine-incidents:/app/incidents

volumes:
  engine-logs:
  engine-incidents:
